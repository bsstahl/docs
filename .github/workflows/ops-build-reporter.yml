name: 'OPS build reporter'

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ops_build_reporter_job:
    name: Add preview links and annotate files
    runs-on: ubuntu-latest
    permissions:
      statuses: read
      checks: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: dotnet/docs-actions/ops-build-reporter@cdb3719bab6025f7621b04044094048f597b1ae0 # main
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          annotate_file_warnings: true
